# Place this at /etc/nginx/sites-available/multispectral-app on the VPS,
# then: sudo ln -s /etc/nginx/sites-available/multispectral-app /etc/nginx/sites-enabled/
# Replace YOUR_DOMAIN_OR_IP below before enabling.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Must match (or exceed) app.py's MAX_CONTENT_LENGTH (MAX_UPLOAD_MB env
    # var, currently 2048MB) -- nginx's own default is just 1MB, which
    # would silently reject large uploads before they ever reach Flask.
    client_max_body_size 2100M;

    # Classification on a large raster can genuinely take several minutes
    # -- nginx's default 60s timeout would kill that connection well
    # before it finishes, even though gunicorn itself would have allowed
    # it. Both layers need a generous, matching timeout.
    proxy_connect_timeout 1800s;
    proxy_send_timeout    1800s;
    proxy_read_timeout    1800s;

    # Basic auth gate for the proof-of-concept phase -- see the deployment
    # notes for how to create /etc/nginx/.htpasswd. Remove this block (and
    # the two auth_basic lines) once/if this needs to be fully public.
    auth_basic           "Multispectral Image Analysis (testing)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
